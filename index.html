<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بيان</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
h1{margin:0;padding:12px;background:#1b2a3a;font-size:18px;text-align:center}
#chat{flex:1;overflow-y:auto;padding:12px}
.m{max-width:80%;padding:8px 12px;margin:6px 0;border-radius:12px;line-height:1.6}
.u{background:#2d6cdf;margin-right:auto;margin-left:0}
.b{background:#2a2a2a;margin-left:auto;margin-right:0}
#bar{display:flex;gap:8px;padding:10px;background:#1b1b1b}
input{flex:1;padding:10px;border-radius:8px;border:0;font-size:16px}
button{padding:10px 18px;border:0;border-radius:8px;background:#2d6cdf;color:#fff;font-size:16px}
</style>
</head>
<body>
<h1>بيان</h1>
<div id="chat"></div>
<div id="bar">
<input id="t" placeholder="اكتب رسالتك..." autocomplete="off">
<button onclick="send()">إرسال</button>
</div>
<script>
const chat = document.getElementById('chat'), t = document.getElementById('t');
t.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
function add(txt, cls) {
  const d = document.createElement('div');
  d.className = 'm ' + cls; d.textContent = txt;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
async function send() {
  const msg = t.value.trim(); if (!msg) return;
  add(msg, 'u'); t.value = '';
  try {
    const r = await fetch('/', {method: 'POST', body: JSON.stringify({msg})});
    const j = await r.json();
    add(j.reply || '...', 'b');
  } catch (e) { add('خطأ في الاتصال', 'b'); }
}
</script>
</body>
</html>
